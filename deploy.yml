name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        env:
          APP_VERSION: ${{ vars.APP_VERSION || '1' }}
          APP_PORT: ${{ secrets.APP_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          cat > .env <<EOF
          APP_VERSION=$APP_VERSION
          APP_PORT=$APP_PORT
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          EOF
          sed 's/=.*/=***/' .env > env.masked

      - name: Start stack
        run: |
          docker compose down --remove-orphans
          docker compose up -d --build --wait
          docker compose ps

      - name: Upload masked .env
        uses: actions/upload-artifact@v4
        with:
          name: env-masked
          path: env.masked

  test-app:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Health check
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          curl -sf "http://localhost:$APP_PORT/health"
          echo "Web is up"

      - name: App reads from DB
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          curl -sf "http://localhost:$APP_PORT/api/items/count"
          echo "App -> DB OK"

  test-data:
    needs: deploy
    runs-on: self-hosted
    outputs:
      db_count: ${{ steps.compare.outputs.db_count }}
      web_count: ${{ steps.compare.outputs.web_count }}
    steps:
      - name: Compare DB and Web
        id: compare
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          DB_COUNT=$(docker compose exec -T db psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT COUNT(*) FROM items;")
          WEB_COUNT=$(curl -sf "http://localhost:$APP_PORT/api/items/count" | jq -r .count)
          echo "db_count=$DB_COUNT"   >> "$GITHUB_OUTPUT"
          echo "web_count=$WEB_COUNT" >> "$GITHUB_OUTPUT"
          echo "DB: $DB_COUNT, Web: $WEB_COUNT"
          [ "$DB_COUNT" = "$WEB_COUNT" ] || { echo "Mismatch"; exit 1; }

  report:
    needs: [deploy, test-app, test-data]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Collect logs and report
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose-logs.txt 2>&1 || true
          docker compose ps -a          > reports/compose-ps.txt   2>&1 || true
          cat > reports/test-report.md <<EOF
          # Test report
          - Run: ${{ github.run_id }} ($(date))
          - Commit: ${{ github.sha }}
          - deploy: ${{ needs.deploy.result }}
          - test-app: ${{ needs.test-app.result }}
          - test-data: ${{ needs.test-data.result }}
          - DB count: ${{ needs.test-data.outputs.db_count }}
          - Web count: ${{ needs.test-data.outputs.web_count }}
          EOF

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
